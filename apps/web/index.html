    <style>
      :root {
        --bg-main: #0B0F1A;
        --bg-card: #161B2E;
        --border-color: #2D313D;
        --text-primary: #FFFFFF;
        --text-secondary: #CBD5E1;
        --text-muted: #94A3B8;
        --blue-accent: #3B82F6;
        --green-accent: #10B981;
        --amber-accent: #F59E0B;
        --indigo-accent: #6366F1;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-secondary);
        margin: 0;
        overflow-x: hidden;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3, h4 {
        color: var(--text-primary);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-main);
      }
      ::-webkit-scrollbar-thumb {
        background: #2D3748;
        border-radius: 4px;
      }
      .input-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
        display: block;
      }
      .card-base {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
      }
      .glow-blue { box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); }
      .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
      .glow-amber { box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }

      /* Noise Texture Overlay */
      .noise-bg::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 100;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      @keyframes slow-gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animate-gradient {
        background-size: 200% 200%;
        animation: slow-gradient 20s ease infinite;
      }
      /* ── GLOBAL READABILITY FIX (WCAG AA) ──────────────────────────────────
         Tailwind slate-500 through slate-900 are near-invisible on dark
         (#0A–#16) backgrounds. We bump ALL up to meet minimum contrast. */
      .text-slate-400  { color: rgb(148 163 184) !important; }   /* → keep */
      .text-slate-500  { color: rgb(148 163 184) !important; }   /* → slate-400 */
      .text-slate-600  { color: rgb(148 163 184) !important; }   /* → slate-400 */
      .text-slate-700  { color: rgb(100 116 139) !important; }   /* → slate-500 */
      .text-slate-800  { color: rgb(71  85  105) !important; }   /* → slate-600 */
      .text-slate-900  { color: rgb(51  65  85)  !important; }   /* → slate-700 */
      /* Fix placeholder readability */
      ::placeholder    { color: rgb(100 116 139) !important; opacity: 1; }
      /* Fix input text visibility */
      input, textarea  { color: #e2e8f0 !important; }
      /* Fix label/badge text */
      label            { color: rgb(148 163 184); }
      /* Ensure body default text is readable */
      body { color: #CBD5E1; }
    </style>
